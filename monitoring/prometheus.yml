global:
  scrape_interval: 2s
  evaluation_interval: 2s

scrape_configs:
  - job_name: 'aeth-protocol'
    static_configs:
      - targets: 
        - 'aeth-bootnode:8080'
        - 'aeth-sequencer-primary:8080'
        - 'aeth-prover-01:8083'

  - job_name: 'trading-defense'
    static_configs:
      - targets: ['aeth-trading-defense:8999']
