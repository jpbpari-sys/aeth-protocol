global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'aeth-protocol'
    static_configs:
      - targets: 
        - 'bootnode:9090'
        - 'sequencer-primary:9090'
        - 'prover-gpu-01:9090'

  - job_name: 'aeth-network'
    static_configs:
      - targets: ['localhost:9090']
