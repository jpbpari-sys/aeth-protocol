version: "3.8"

services:
  bootnode:
    build:
      context: .
      dockerfile: Dockerfile.network
    container_name: aeth-bootnode
    command: ["--role", "full", "--listen", "/ip4/0.0.0.0/tcp/4001"]
    ports:
      - "4001:4001"
      - "9090:9090"
    networks:
      - aeth-mesh

  sequencer-primary:
    build:
      context: .
      dockerfile: Dockerfile.network
    container_name: aeth-sequencer-primary
    depends_on:
      - bootnode
    command: ["--role", "sequencer", "--bootnodes", "/dns4/bootnode/tcp/4001/p2p/BOOTNODE_ID"]
    networks:
      - aeth-mesh

  prover-01:
    build:
      context: .
      dockerfile: Dockerfile.prover
    container_name: aeth-prover-01
    depends_on:
      - sequencer-primary
    networks:
      - aeth-mesh

  prometheus:
    image: prom/prometheus:latest
    container_name: aeth-prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9091:9090"
    networks:
      - aeth-mesh

  grafana:
    image: grafana/grafana:latest
    container_name: aeth-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=aetheris
    networks:
      - aeth-mesh

networks:
  aeth-mesh:
    driver: bridge
