name: AETH CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace -- -D warnings

      - name: Build (release)
        run: cargo build --workspace --release

      - name: Run tests
        run: cargo test --workspace -- --nocapture

  docker:
    name: Docker Build
    needs: rust
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push aeth-network
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.network
          push: true
          tags: ghcr.io/${{ github.repository }}/aeth-network:latest

      - name: Build & push aeth-prover
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.prover
          push: true
          tags: ghcr.io/${{ github.repository }}/aeth-prover:latest

  release:
    name: Create Release
    needs: docker
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - name: Build release binaries
        run: cargo build --workspace --release
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/aeth-network
            target/release/aeth-prover
            target/release/aeth-simulator
